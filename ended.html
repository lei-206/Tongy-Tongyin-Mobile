<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>“童语同音”学前儿童普通话师资培训 - 报名已结束</title>
    <meta name="viewport"
        content="width=device-width,minimum-scale=1,maximum-scale=1,initial-scale=1,user-scalable=no" />
    <meta name="format-detection" content="telephone=no">
    <link href="style/index.css" rel="stylesheet" type="text/css">
    <link href="style/common.scss" rel="stylesheet" type="text/css">
</head>

<body>
    <div id="app" v-cloak class="welcome-page">
        <div class="welcome-container">
            <img src="style/img/title-welcome-mobile.png" alt="欢迎进入童语同音学前儿童普通话师资培训线上培训平台" class="title-image">
            
            <div class="welcome-status-wrap">
                <div class="status-top-icon ended">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="btn-status-pill ended">
                    <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <span>{{ statusText }}</span>
                </div>
                <p class="status-time-desc">{{ timeDesc }}</p>
            </div>
        </div>

        <!-- <footer class="page-footer">
            <p>网络教育数字化学习资源中心 版权所有</p>
            <p>技术支持：国开泛在（北京）教育科技有限公司</p>
            <p>ICP备xxxxxxxx号 公安网备xxxxxx号</p>
        </footer> -->
    </div>

    <script src="style/vue.js"></script>
    <script src="style/vant.min.js"></script>
    <script>
        const { createApp, ref } = Vue;
        const app = createApp({
            setup() {
                const statusText = ref('报名已结束');
                const timeDesc = ref('本期报名已截止，请关注后续培训通知');
                return { statusText, timeDesc };
            }
        });
        app.use(vant);
        app.mount('#app');
    </script>
</body>

</html>
